<style>
:root{
  --navy:#14284A; --navy-2:#1E3A66; --red:#A82B33; --red-2:#8E2129;
  --denim:#5B7FA6; --wheat:#C6912F; --olive:#6B7F4E;
  --ground:#EDF1F6; --surface:#FCFBF8; --surface-2:#F2F5F9;
  --ink:#16233A; --ink-2:#3E5069; --ink-3:#6A7B92;
  --rule:#D3DCE7; --rule-2:#E4EAF1;
  --focus:#A82B33;
  --shadow:0 1px 2px rgba(20,40,74,.06),0 8px 24px rgba(20,40,74,.07);
  --radius:10px;
  --base:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#0D1626; --navy-2:#1B2B47; --red:#E06B70; --red-2:#C9545A;
    --denim:#8FB3D6; --wheat:#DFB25C; --olive:#9BAE7C;
    --ground:#0B1220; --surface:#141F33; --surface-2:#1B2740;
    --ink:#E9EDF3; --ink-2:#BCC8D8; --ink-3:#8B9AB0;
    --rule:#2A3A56; --rule-2:#22314A;
    --focus:#E06B70;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --navy:#0D1626; --navy-2:#1B2B47; --red:#E06B70; --red-2:#C9545A;
  --denim:#8FB3D6; --wheat:#DFB25C; --olive:#9BAE7C;
  --ground:#0B1220; --surface:#141F33; --surface-2:#1B2740;
  --ink:#E9EDF3; --ink-2:#BCC8D8; --ink-3:#8B9AB0;
  --rule:#2A3A56; --rule-2:#22314A;
  --focus:#E06B70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--base); line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Zilla Slab",Georgia,"Times New Roman",serif; text-wrap:balance; margin:0}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- masthead ---- */
.masthead{
  background:var(--navy); color:#fff; padding:.6rem clamp(.8rem,3vw,1.3rem);
  display:flex; align-items:center; gap:.9rem; position:sticky; top:0; z-index:30;
  border-bottom:3px solid var(--red);
}
.badge{width:38px;height:38px;flex:none;border-radius:50%;display:block}
.mast-text{flex:1;min-width:0}
.eyebrow{
  font-size:.66rem; letter-spacing:.16em; text-transform:uppercase;
  color:#9DBBD8; font-weight:700; display:block; line-height:1.3;
}
.mast-text strong{font-family:"Zilla Slab",Georgia,serif;font-size:1.18rem;font-weight:700;display:block;line-height:1.15}
.textsize{display:flex;align-items:center;gap:.4rem;flex:none}
.textsize span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#9DBBD8;font-weight:700}
.tbtn{
  background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.28);
  border-radius:6px; cursor:pointer; font-family:inherit; font-weight:700;
  width:30px; height:30px; line-height:1; font-size:.95rem;
}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red)}

/* ---- shell ---- */
.shell{
  max-width:1240px; margin:0 auto; padding:clamp(.7rem,2vw,1.1rem);
  display:grid; grid-template-columns:minmax(0,1fr) 288px; gap:clamp(.7rem,1.6vw,1.1rem);
  align-items:start;
}
@media (max-width:900px){ .shell{grid-template-columns:minmax(0,1fr)} .browser{order:-1} }

/* ---- cards ---- */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:clamp(.9rem,2.4vw,1.3rem);
}
.stream{display:flex;flex-direction:column;gap:.8rem}
.msg{display:flex;gap:.6rem;align-items:flex-start}
.msg .badge{width:32px;height:32px;margin-top:.25rem}
.msg .card{flex:1;min-width:0}
.card h2{font-size:1.22rem;color:var(--navy-2);margin-bottom:.5rem;line-height:1.2}
:root[data-theme="dark"] .card h2{color:var(--denim)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h2{color:var(--denim)}}
.card p{margin:0 0 .85rem}
.card p:last-child{margin-bottom:0}
.lead{max-width:64ch}
.intro h2{font-size:1.32rem}
.intro .lead{font-size:.95rem}
.intro .checks{font-size:.95rem;gap:.4rem}
.intro .divider{margin:.9rem 0 .7rem}

/* ---- checklist ---- */
.checks{list-style:none;padding:0;margin:0 0 .3rem;display:flex;flex-direction:column;gap:.45rem}
.checks li{display:flex;gap:.6rem;align-items:baseline}
.checks .tick{color:var(--olive);font-weight:700;flex:none}
.checks b{color:var(--navy-2);font-weight:700}
:root[data-theme="dark"] .checks b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .checks b{color:var(--ink)}}

/* ---- steps ---- */
ol.steps{margin:0 0 1rem;padding-left:1.35rem;display:flex;flex-direction:column;gap:.5rem}
ol.steps li{padding-left:.2rem}

/* ---- table ---- */
.tablewrap{overflow-x:auto;margin:0 0 1rem;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.97rem;min-width:420px}
thead th{
  background:var(--surface-2); text-align:left; padding:.6rem .8rem;
  font-size:.68rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); font-weight:700; border-bottom:1px solid var(--rule);
}
td{padding:.65rem .8rem;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.when{color:var(--red);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- callout ---- */
.callout{
  border-left:4px solid var(--denim); background:var(--surface-2);
  padding:.8rem 1rem; margin:0 0 1rem; border-radius:0 6px 6px 0;
}
.callout.warn{border-left-color:var(--wheat)}
.callout p{margin:0}

/* ---- cta ---- */
.cta{
  display:inline-block; background:var(--red); color:#fff; text-decoration:none;
  font-weight:700; padding:.6rem 1.05rem; border-radius:7px; font-size:.98rem;
  border:0; cursor:pointer; font-family:inherit;
}
.cta:hover{background:var(--red-2)}
.source{font-size:.8rem;color:var(--ink-3);margin:.5rem 0 0}

/* ---- related / feedback ---- */
.divider{border:0;border-top:1px solid var(--rule-2);margin:1.1rem 0 .85rem}
.label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 .55rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  background:var(--surface-2); border:1px solid var(--rule); color:var(--ink);
  border-radius:999px; padding:.35rem .8rem; font:inherit; font-size:.88rem;
  cursor:pointer;
}
.chip:hover{border-color:var(--denim);background:var(--surface)}
.feedback{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1rem;font-size:.94rem;color:var(--ink-2)}
.fb{background:var(--surface-2);border:1px solid var(--rule);border-radius:999px;padding:.35rem .85rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
.fb:hover{border-color:var(--denim)}
.fb[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}

/* ---- browser ---- */
.browser{
  background:var(--surface); border:1px solid var(--rule); border-top:4px solid var(--wheat);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:.95rem; position:sticky; top:4.6rem;
}
@media (max-width:900px){.browser{position:static}}
.browser h2{font-size:1.06rem;color:var(--navy-2);margin-bottom:.35rem;line-height:1.2}
:root[data-theme="dark"] .browser h2{color:var(--denim)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .browser h2{color:var(--denim)}}
.browser>p{color:var(--ink-2);font-size:.86rem;margin:0 0 .8rem;line-height:1.45}
.cats{display:flex;flex-direction:column;gap:.4rem}
.cat{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.cat.open{border-color:var(--navy-2)}
.cat>button{
  width:100%; display:flex; align-items:center; gap:.5rem; padding:.55rem .7rem; font-size:.93rem;
  background:none; border:0; cursor:pointer; font:inherit; font-weight:700;
  color:var(--ink); text-align:left;
}
.cat>button:hover{background:var(--surface-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cat>button .arrow{margin-left:auto;color:var(--ink-3);font-size:.75rem;transition:transform .15s}
.cat.open>button .arrow{transform:rotate(90deg)}
.catlist{list-style:none;margin:0;padding:0 0 .5rem;display:none;flex-direction:column}
.cat.open .catlist{display:flex}
.catlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer; font:inherit;
  color:var(--ink-2); padding:.34rem .7rem .34rem 1.75rem; line-height:1.35; font-size:.88rem;
}
.catlist button:hover{color:var(--red);background:var(--surface-2)}
.browser .foot{font-size:.82rem;color:var(--ink-3);margin:.8rem 0 0;padding-top:.7rem;border-top:1px solid var(--rule-2)}

/* ---- ask bar ---- */
.askbar{
  position:sticky; bottom:0; z-index:20; background:var(--ground);
  border-top:1px solid var(--rule); padding:.6rem clamp(.8rem,3vw,1.3rem);
}
.askinner{max-width:1240px;margin:0 auto;display:flex;gap:.7rem}
.askinner input{
  flex:1; min-width:0; padding:.65rem .85rem; font:inherit; font-size:.98rem;
  border:2px solid var(--rule); border-radius:8px; background:var(--surface); color:var(--ink);
}
.askinner input:focus{border-color:var(--denim);outline:none}
.askinner input::placeholder{color:var(--ink-3)}

/* ---- triage form ---- */
.triage{display:flex;flex-direction:column;gap:1rem;margin:0 0 1rem}
.field label{display:block;font-weight:700;margin-bottom:.4rem;color:var(--navy-2)}
:root[data-theme="dark"] .field label{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .field label{color:var(--ink)}}
.field input,.field select,.field textarea{
  width:100%; padding:.6rem .75rem; font:inherit; border:1px solid var(--rule);
  border-radius:6px; background:var(--surface-2); color:var(--ink);
}
.field textarea{min-height:5rem;resize:vertical}
.out{
  background:var(--surface-2); border:1px dashed var(--denim); border-radius:8px;
  padding:.9rem 1rem; white-space:pre-wrap; font-size:.96rem; margin:0 0 .9rem;
}

/* ---- room finder ---- */
.roomsearch{
  width:100%; padding:.7rem .9rem; font:inherit; border:2px solid var(--rule);
  border-radius:8px; background:var(--surface-2); color:var(--ink); margin:0 0 1rem;
}
.roomsearch:focus{border-color:var(--denim);outline:none}
.roomlist{list-style:none;margin:0;padding:0;max-height:26rem;overflow-y:auto;display:flex;flex-direction:column;gap:.15rem}
.roomlist li a{
  display:flex; gap:.6rem; align-items:baseline; padding:.5rem .6rem;
  text-decoration:none; color:var(--ink); border-radius:6px;
}
.roomlist li a:hover{background:var(--surface-2)}
.roomlist .rname{font-weight:600}
.roomlist .rcat{margin-left:auto;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.count{font-size:.9rem;color:var(--ink-3);margin:0 0 .6rem}
.pending{
  display:inline-block; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
  font-weight:700; color:#fff; background:var(--wheat); padding:.15rem .5rem; border-radius:4px;
  vertical-align:middle; margin-left:.5rem;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

  {name:"Talk Time &amp; your state", color:"var(--red)", qs:["talk-time","state-group","lost-access","telegram"]},
  {name:"Live shows &amp; replays", color:"var(--denim)", qs:["watch-live","schedule","replays"]},
  {name:"Your account &amp; billing", color:"var(--wheat)", qs:["cancel","change-card","still-charged"]},
  {name:"Find a room", color:"var(--olive)", qs:["find-room","disappeared","humanitarian"]},
  {name:"Something's not working", color:"var(--ink-3)", qs:["app-trouble","notifications","locked-out","text-small"]}
];

/* ---------- rendering ---------- */
const stream = document.getElementById("stream");
const BADGE = document.querySelector(".masthead .badge").outerHTML;

function esc(s){return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}

function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}

function renderAnswer(key){
  const a = A[key]; if(!a) return;
  const msg = document.createElement("div"); msg.className="msg";
  msg.innerHTML = BADGE.replace('class="badge"','class="badge" aria-hidden="true"');
  const card = document.createElement("div"); card.className="card";

  let h = `<h2>${a.h}${a.pending?'<span class="pending">Being updated</span>':''}</h2>`;
  h += `<div class="lead">${a.body||""}</div>`;
  if(a.steps) h += `<ol class="steps">${a.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
  if(a.table){
    h += `<div class="tablewrap"><table><thead><tr>${a.table.head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`
      + a.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===2&&a.table.head.length>3?' class="when"':''}>${c}</td>`).join("")}</tr>`).join("")
      + `</tbody></table></div>`;
  }
  if(a.callout) h += `<div class="callout"><p>${a.callout}</p></div>`;
  if(a.callout2) h += `<div class="callout ${a.callout2.warn?'warn':''}"><p>${a.callout2.html}</p></div>`;
  if(a.rooms) h += roomFinderHTML();
  if(a.triage) h += triageHTML(a.triage);
  if(a.cta){
    h += a.cta.url
      ? `<a class="cta" href="${a.cta.url}" target="_blank" rel="noopener">${a.cta.label}</a>`
      : `<button class="cta" data-goto="${a.cta.action}">${a.cta.label}</button>`;
  }
  if(a.source) h += `<p class="source">${a.source}</p>`;

  const rel = (a.related||[]).filter(k=>A[k]);
  h += `<hr class="divider">`;
  if(rel.length){
    h += `<p class="label">Related</p><div class="chips">`
      + rel.map(k=>`<button class="chip" data-goto="${k}">${A[k].q}</button>`).join("") + `</div>`;
  }
  h += `<div class="feedback"><span>Did this help?</span>
        <button class="fb" data-fb="y">&#128077; Yes</button>
        <button class="fb" data-fb="n">&#128078; No</button></div>`;

  card.innerHTML = h;
  msg.appendChild(card);
  stream.appendChild(msg);

  card.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
  card.querySelectorAll("[data-fb]").forEach(b=>b.addEventListener("click",()=>{
    card.querySelectorAll("[data-fb]").forEach(o=>o.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
  }));
  if(a.rooms) wireRoomFinder(card);
  if(a.triage) wireTriage(card,a.triage);

  msg.scrollIntoView({behavior:"smooth",block:"start"});
}

function roomFinderHTML(){
  return `<label class="sr" for="rs">Search rooms</label>
    <input class="roomsearch" id="rs" type="text" placeholder="Type a room name, your state, or a word&hellip;" autocomplete="off">
    <p class="count" data-count></p><ul class="roomlist" data-rooms></ul>`;
}
function wireRoomFinder(card){
  const input=card.querySelector(".roomsearch"), list=card.querySelector("[data-rooms]"), count=card.querySelector("[data-count]");
  function draw(q){
    const t=q.trim().toLowerCase();
    const hits = !t ? ROOMS : ROOMS.filter(r =>
      r.t.toLowerCase().includes(t) || r.c.toLowerCase().includes(t) ||
      (r.a||[]).some(x=>x.includes(t)));
    count.textContent = t ? `${hits.length} room${hits.length===1?"":"s"} match "${q.trim()}"` : `${ROOMS.length} rooms`;
    list.innerHTML = hits.slice(0,200).map(r =>
      `<li><a href="${r.u}" target="_blank" rel="noopener"><span class="rname">${esc(r.t)}</span><span class="rcat">${esc(r.c)}</span></a></li>`
    ).join("") || `<li><a>Nothing matched. Try a shorter word.</a></li>`;
  }
  input.addEventListener("input",()=>draw(input.value));
  draw("");
}

function triageHTML(t){
  return `<div class="triage">` + t.fields.map(f=>{
    const id=`${t.id}-${f.k}`;
    let ctrl;
    if(f.type==="select") ctrl=`<select id="${id}" data-k="${f.k}"><option value="">Choose one&hellip;</option>`+f.opts.map(o=>`<option>${o}</option>`).join("")+`</select>`;
    else if(f.type==="textarea") ctrl=`<textarea id="${id}" data-k="${f.k}" placeholder="${f.ph||""}"></textarea>`;
    else ctrl=`<input id="${id}" type="text" data-k="${f.k}" placeholder="${f.ph||""}">`;
    return `<div class="field"><label for="${id}">${f.label}</label>${ctrl}</div>`;
  }).join("") + `</div>
  <div class="callout"><p>${t.note}</p></div>
  <button class="cta" data-build>Write this up for me</button>
  <div data-result></div>`;
}
function wireTriage(card,t){
  const btn=card.querySelector("[data-build]"), out=card.querySelector("[data-result]");
  btn.addEventListener("click",()=>{
    const parts=[];
    t.fields.forEach(f=>{
      const v=card.querySelector(`[data-k="${f.k}"]`).value.trim();
      if(v) parts.push(`${f.label.replace(/\?$/,"")}: ${v}`);
    });
    if(!parts.length){ out.innerHTML=`<p class="source">Fill in at least one answer above first.</p>`; return; }
    const text = parts.join("\n") + "\n\n(Please add a screenshot if you can.)";
    out.innerHTML = `<hr class="divider"><p class="label">Copy this into a post in the Members Lobby</p>
      <div class="out">${esc(text)}</div>
      <a class="cta" href="https://www.patriotchute.com/spaces/4755493" target="_blank" rel="noopener">Open Members Lobby</a>`;
  });
}

function go(key){ renderAnswer(key); }

/* ---------- browser ---------- */
const catsEl=document.getElementById("cats");
CATS.forEach((c,i)=>{
  const d=el(`<div class="cat${i===0?" open":""}">
    <button aria-expanded="${i===0}"><span class="dot" style="background:${c.color}"></span>${c.name}<span class="arrow">&#9654;</span></button>
    <ul class="catlist">${c.qs.filter(k=>A[k]).map(k=>`<li><button data-goto="${k}">${A[k].q}</button></li>`).join("")}</ul>
  </div>`);
  d.querySelector("button").addEventListener("click",()=>{
    const open=d.classList.toggle("open");
    d.querySelector("button").setAttribute("aria-expanded",String(open));
  });
  d.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
  catsEl.appendChild(d);
});

/* ---------- search ---------- */
const SYN = {
  "cancel":"cancel","unsubscribe":"cancel","stop paying":"cancel","refund":"still-charged",
  "charged":"still-charged","charge":"still-charged","billing":"change-card","card":"change-card",
  "payment":"change-card","pay":"change-card",
  "talk time":"talk-time","talktime":"talk-time","patriot talk":"talk-time","discord":"talk-time",
  "chat":"talk-time","voice":"talk-time",
  "telegram":"telegram","signal":"telegram",
  "state":"state-group","county":"state-group","local":"state-group",
  "show":"watch-live","live":"watch-live","watch":"watch-live","rumble":"watch-live",
  "coffee":"watch-live","news":"watch-live","time":"schedule","calendar":"schedule","today":"schedule",
  "replay":"replays","recording":"replays","missed":"replays",
  "humanitarian":"humanitarian","project":"humanitarian","form":"humanitarian",
  "room":"find-room","where":"find-room","find":"find-room","group":"find-room",
  "notification":"notifications","notifications":"notifications","email":"notifications","alert":"notifications",
  "crash":"app-trouble","app":"app-trouble","broken":"app-trouble","not working":"app-trouble",
  "loading":"app-trouble","slow":"app-trouble",
  "login":"locked-out","log in":"locked-out","sign in":"locked-out","password":"locked-out",
  "locked":"locked-out","access":"locked-out",
  "small":"text-small","font":"text-small","read":"text-small","print":"text-small","big":"text-small",
  "new":"start-here","start":"start-here","begin":"start-here",
  "removed":"guidelines","muted":"guidelines","banned":"guidelines","rules":"guidelines",
  "disappeared":"disappeared","gone":"disappeared","missing":"disappeared"
};

function search(qRaw){
  const q=qRaw.toLowerCase().trim();
  if(!q) return null;
  for(const k in A) if(A[k].q.toLowerCase().replace(/&mdash;|&ldquo;|&rdquo;/g,"")===q) return k;
  let best=null,bestLen=0;
  for(const term in SYN){ if(q.includes(term) && term.length>bestLen){best=SYN[term];bestLen=term.length;} }
  if(best) return best;
  const room = ROOMS.find(r=>q.includes(r.t.toLowerCase()) || (r.a||[]).some(x=>q.includes(x)));
  if(room) return "find-room";
  return null;
}

document.getElementById("askform").addEventListener("submit",e=>{
  e.preventDefault();
  const input=document.getElementById("ask"), v=input.value;
  const hit=search(v);
  if(hit){ go(hit); }
  else{
    const msg=document.createElement("div"); msg.className="msg";
    msg.innerHTML=BADGE.replace('class="badge"','class="badge" aria-hidden="true"');
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<h2>I don't have an answer for that yet</h2>
      <p>This Navigator is new and we're still adding answers to it.</p>
      <p>Pick a topic on the right, search all the rooms, or post your question in the Members Lobby &mdash; an admin will pick it up.</p>
      <button class="cta" data-goto="find-room">Search all rooms</button>
      <p class="source">Your question was noted so we can add it: &ldquo;${esc(v)}&rdquo;</p>`;
    card.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
    msg.appendChild(card); stream.appendChild(msg);
    msg.scrollIntoView({behavior:"smooth",block:"start"});
  }
  input.value="";
});

/* ---------- text size ---------- */
let size=16;
const SZ_MIN=14, SZ_MAX=26;
function setSize(n,save){
  size=Math.max(SZ_MIN,Math.min(SZ_MAX,n));
  document.documentElement.style.setProperty("--base",size+"px");
  document.getElementById("tminus").disabled=size<=SZ_MIN;
  document.getElementById("tplus").disabled=size>=SZ_MAX;
  if(save){ try{ localStorage.setItem("ppn-nav-size",String(size)); }catch(e){} }
}
document.getElementById("tplus").addEventListener("click",()=>setSize(size+2,true));
document.getElementById("tminus").addEventListener("click",()=>setSize(size-2,true));
try{ const s=parseInt(localStorage.getItem("ppn-nav-size"),10); if(s) setSize(s,false); else setSize(16,false); }
catch(e){ setSize(16,false); }
